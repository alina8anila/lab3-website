{% extends "base.html" %}
{% block title %}Кафедри у ФОЗ{% endblock %}
{% block content %}
  {% for department in departments %}
    <div class="card">
      <h2><a href="{% url 'department_detail' department.pk %}">{{ department.name }}</a></h2>
      <p>Завідувач: {{ department.head }}</p>
    </div>
  {% empty %}
    <p>Кафедр поки немає.</p>
  {% endfor %}
{% endblock %}
